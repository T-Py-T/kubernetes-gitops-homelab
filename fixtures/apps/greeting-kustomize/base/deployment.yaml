apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-service
  labels:
    app.kubernetes.io/name: greeting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: greeting-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greeting-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/echoserver:2.5
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
