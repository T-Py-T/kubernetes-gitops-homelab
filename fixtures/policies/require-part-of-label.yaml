apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-part-of-label
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-part-of
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - Service
      validate:
        message: Workloads must declare app.kubernetes.io/part-of.
        pattern:
          metadata:
            labels:
              app.kubernetes.io/part-of: "?*"
