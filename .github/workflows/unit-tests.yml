name: Unit tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  policy-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d473a4c7e2c869b9bc6c4c5a
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Run repository policy unit tests
        run: python3 -m pytest scripts/tests -v
