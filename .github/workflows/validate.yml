name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.75.0

      - name: Validate repository policy
        env:
          RUN_TRIVY_SCAN: "1"
        run: ./scripts/validate.sh

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          version: v0.11.0

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@4d036b826b8b2df8671d140de0d86cef0f5c2202
        with:
          globs: |
            **/*.md
            #node_modules

      - name: Install the locked dev-container CLI
        run: |
          npm ci --ignore-scripts
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build and test the development container
        uses: devcontainers/ci@00115d9fb3fc4a15dc9b460cce0af467b77dbe21
        with:
          push: never
          runCmd: .devcontainer/setup.sh
